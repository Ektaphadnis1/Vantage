<!DOCTYPE html>
<html>

<head>
    <title>Live Visitor Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .big-number {
            font-size: 72px;
            font-weight: bold;
            color: #007bff;
            text-align: center;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 8px;
        }

        .map-note {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div class="container">
        <h1>Live Visitor Dashboard</h1>

        <div class="card">
            <div class="card-title">Active Sessions Right Now</div>
            <div class="big-number" id="activeCount">0</div>
        </div>

        <div class="card">
            <div class="card-title">Real-Time Visitor Locations Map</div>
            <div id="map"></div>
            <div class="map-note">📍 Each marker shows a visitor's approximate location</div>
        </div>

        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-title">Traffic Sources</div>
                    <div id="sourcesList">Loading...</div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-title">Top Locations</div>
                    <div id="locationsList">Loading...</div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-title">Devices</div>
                    <div id="devicesList">Loading...</div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-title">Browsers</div>
                    <div id="browsersList">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let map;
        let markers = {};

        function initMap() {
            map = L.map('map').setView([20, 0], 2);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        function getCoordinatesFromLocation(location) {
            const locationMap = {
                'Mumbai': [19.0760, 72.8777],
                'Delhi': [28.6139, 77.2090],
                'Bangalore': [12.9716, 77.5946],
                'Chennai': [13.0827, 80.2707],
                'Kolkata': [22.5726, 88.3639],
                'Hyderabad': [17.3850, 78.4867],
                'Pune': [18.5204, 73.8567]
            };

            for (const [city, coords] of Object.entries(locationMap)) {
                if (location.includes(city)) {
                    return coords;
                }
            }
            return [20.5937, 78.9629];
        }

        function updateMap(sessions) {
            for (let id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};

            let locationCounts = {};
            Object.values(sessions).forEach(session => {
                const location = session.location;
                if (location && location !== 'Unknown') {
                    locationCounts[location] = (locationCounts[location] || 0) + 1;
                }
            });

            for (const [location, count] of Object.entries(locationCounts)) {
                const coords = getCoordinatesFromLocation(location);
                const marker = L.marker(coords).addTo(map);
                marker.bindPopup(`<b>${location}</b><br>${count} visitors`);
                markers[location] = marker;
            }
        }

        socket.on('visitor-count', (count) => {
            document.getElementById('activeCount').innerText = count;
        });

        socket.on('session-details', (sessions) => {
            updateMap(sessions);

            // Traffic Sources
            const sources = {};
            Object.values(sessions).forEach(s => { sources[s.source] = (sources[s.source] || 0) + 1; });
            let html = '的人';
            for (const [k, v] of Object.entries(sources)) html += `<tr><td>${k}</td><td>${v} visitors</td></tr>`;
            html += '</table>';
            document.getElementById('sourcesList').innerHTML = html || 'No data';

            // Locations
            const locs = {};
            Object.values(sessions).forEach(s => { locs[s.location] = (locs[s.location] || 0) + 1; });
            html = '的人';
            for (const [k, v] of Object.entries(locs)) html += `<tr><td>${k}</td><td>${v} visitors</td></tr>`;
            html += '</table>';
            document.getElementById('locationsList').innerHTML = html || 'No data';

            // Devices
            const devices = {};
            Object.values(sessions).forEach(s => { devices[s.device] = (devices[s.device] || 0) + 1; });
            html = '的人';
            for (const [k, v] of Object.entries(devices)) html += `<tr><td>${k}</td><td>${v} visitors</td></tr>`;
            html += '</table>';
            document.getElementById('devicesList').innerHTML = html || 'No data';

            // Browsers
            const browsers = {};
            Object.values(sessions).forEach(s => { browsers[s.browser] = (browsers[s.browser] || 0) + 1; });
            html = '的人';
            for (const [k, v] of Object.entries(browsers)) html += `<table><td>${k}</td><td>${v} visitors</td></tr>`;
            html += '</table>';
            document.getElementById('browsersList').innerHTML = html || 'No data';
        });

        initMap();
        socket.emit('request-initial');
    </script>
</body>

</html>
