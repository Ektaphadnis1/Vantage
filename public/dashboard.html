<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Visitor Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #00d4ff;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 8px;
        }

        .big-number {
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            color: #00d4ff;
        }

        .map-container {
            margin-bottom: 20px;
        }

        #map {
            height: 400px;
            border-radius: 12px;
            background: #0f0f1a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 10px 5px;
            border-bottom: 1px solid #2a2a4a;
        }

        td:first-child {
            font-weight: bold;
        }

        td:last-child {
            text-align: right;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .connection-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
            margin-right: 8px;
        }

        .status-text {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
            text-align: right;
        }

        .event-item {
            padding: 8px;
            border-bottom: 1px solid #2a2a4a;
            font-size: 13px;
        }

        .event-time {
            color: #888;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 Live Visitor Dashboard</h1>

        <div class="map-container">
            <div class="card">
                <h3>🌍 Real-Time Visitor Locations</h3>
                <div id="map"></div>
                <div class="status-text" id="mapStatus">📍 Markers appear when visitors arrive</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>👥 Active Sessions</h3>
                <div class="big-number" id="activeCount">0</div>
            </div>

            <div class="card">
                <h3>🔗 Traffic Sources</h3>
                <div id="sourcesList">
                    <div class="no-data">Waiting for data...</div>
                </div>
            </div>

            <div class="card">
                <h3>📍 Top Locations</h3>
                <div id="locationsList">
                    <div class="no-data">Waiting for data...</div>
                </div>
            </div>

            <div class="card">
                <h3>📱 Devices</h3>
                <div id="devicesList">
                    <div class="no-data">Waiting for data...</div>
                </div>
            </div>

            <div class="card">
                <h3>🌐 Browsers</h3>
                <div id="browsersList">
                    <div class="no-data">Waiting for data...</div>
                </div>
            </div>

            <div class="card">
                <h3>🛒 Live Events</h3>
                <div id="eventsList" style="max-height: 250px; overflow-y: auto;">
                    <div class="no-data">Waiting for events...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let map;
        let markers = {};

        // Initialize map - centered on India
        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // Get coordinates from location string
        function getCoordinatesFromLocation(location) {
            const coordinates = {
                'Pune': [18.5204, 73.8567],
                'Mumbai': [19.0760, 72.8777],
                'Delhi': [28.6139, 77.2090],
                'Bangalore': [12.9716, 77.5946],
                'Chennai': [13.0827, 80.2707],
                'Kolkata': [22.5726, 88.3639],
                'Hyderabad': [17.3850, 78.4867],
                'Ahmedabad': [23.0225, 72.5714],
                'Jaipur': [26.9124, 75.7873],
                'Lucknow': [26.8467, 80.9462],
                'Indore': [22.7196, 75.8577],
                'Surat': [21.1702, 72.8311],
                'Vadodara': [22.3072, 73.1812],
                'Nagpur': [21.1458, 79.0882],
                'Nashik': [19.9975, 73.7898],
                'Rajkot': [22.3039, 70.8022],
                'Bhopal': [23.2599, 77.4126],
                'Chandigarh': [30.7333, 76.7794],
                'Coimbatore': [11.0168, 76.9558],
                'Visakhapatnam': [17.6868, 83.2185],
                'Patna': [25.5941, 85.1376],
                'Varanasi': [25.3176, 82.9739],
                'Bhubaneswar': [20.2961, 85.8245],
                'Goa': [15.2993, 74.1240],
                'Kochi': [9.9312, 76.2673],
                'Mysore': [12.2958, 76.6394]
            };

            // Check for city match
            for (const [city, coords] of Object.entries(coordinates)) {
                if (location.toLowerCase().includes(city.toLowerCase())) {
                    return coords;
                }
            }

            // Default: center of India
            return [20.5937, 78.9629];
        }

        // Update map with markers
        function updateMap(sessions) {
            // Remove existing markers
            for (let id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};

            // Count visitors per location
            let locationCounts = {};
            Object.values(sessions).forEach(session => {
                const location = session.location;
                if (location && !location.includes('failed') && location !== 'Unknown') {
                    locationCounts[location] = (locationCounts[location] || 0) + 1;
                }
            });

            // Add markers for each location
            for (const [location, count] of Object.entries(locationCounts)) {
                const coords = getCoordinatesFromLocation(location);
                const marker = L.marker(coords).addTo(map);
                marker.bindPopup(`
                    <b>📍 ${location}</b><br>
                    👥 ${count} active visitor${count > 1 ? 's' : ''}
                `);
                markers[location] = marker;
            }

            // Update status text
            const statusEl = document.getElementById('mapStatus');
            if (Object.keys(markers).length === 0) {
                statusEl.innerHTML = '📍 Waiting for visitors... (markers will appear here)';
            } else {
                statusEl.innerHTML = `📍 ${Object.keys(markers).length} location${Object.keys(markers).length > 1 ? 's' : ''} with active visitors`;
            }
        }

        // Update tables
        function updateTrafficSources(sessions) {
            const sources = {};
            Object.values(sessions).forEach(session => {
                const source = session.source;
                sources[source] = (sources[source] || 0) + 1;
            });

            if (Object.keys(sources).length === 0) {
                document.getElementById('sourcesList').innerHTML = '<div class="no-data">No visitors yet</div>';
                return;
            }

            let html = '<table>';
            for (const [source, count] of Object.entries(sources)) {
                html += `<tr><td>${source}</td><td>${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
            }
            html += '</table>';
            document.getElementById('sourcesList').innerHTML = html;
        }

        function updateLocations(sessions) {
            const locations = {};
            Object.values(sessions).forEach(session => {
                const location = session.location;
                if (location && !location.includes('failed')) {
                    locations[location] = (locations[location] || 0) + 1;
                }
            });

            if (Object.keys(locations).length === 0) {
                document.getElementById('locationsList').innerHTML = '<div class="no-data">No visitors yet</div>';
                return;
            }

            const sorted = Object.entries(locations).sort((a, b) => b[1] - a[1]).slice(0, 5);
            let html = '<table>';
            for (const [location, count] of sorted) {
                html += `<tr><td>${location}</td><td>${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
            }
            html += '</table>';
            document.getElementById('locationsList').innerHTML = html;
        }

        function updateDevices(sessions) {
            const devices = {};
            Object.values(sessions).forEach(session => {
                const device = session.device;
                devices[device] = (devices[device] || 0) + 1;
            });

            if (Object.keys(devices).length === 0) {
                document.getElementById('devicesList').innerHTML = '<div class="no-data">No visitors yet</div>';
                return;
            }

            let html = '<table>';
            for (const [device, count] of Object.entries(devices)) {
                html += `<tr><td>${device}</td><td>${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
            }
            html += '</table>';
            document.getElementById('devicesList').innerHTML = html;
        }

        function updateBrowsers(sessions) {
            const browsers = {};
            Object.values(sessions).forEach(session => {
                const browser = session.browser;
                browsers[browser] = (browsers[browser] || 0) + 1;
            });

            if (Object.keys(browsers).length === 0) {
                document.getElementById('browsersList').innerHTML = '<div class="no-data">No visitors yet</div>';
                return;
            }

            let html = '<table>';
            for (const [browser, count] of Object.entries(browsers)) {
                html += `<tr><td>${browser}</td><td>${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
            }
            html += '</table>';
            document.getElementById('browsersList').innerHTML = html;
        }

        // Custom events
        socket.on('custom-event', (event) => {
            const eventsDiv = document.getElementById('eventsList');
            const eventHtml = `
                <div class="event-item">
                    <strong>${event.type === 'add_to_cart' ? '🛒 Add to Cart' : '👁️ Product View'}</strong>
                    <span style="float: right; color: #00d4ff;">${event.product || ''}</span>
                    <br>
                    <span class="event-time">${event.timestamp || new Date().toLocaleTimeString()}</span>
                </div>
            `;

            if (eventsDiv.innerHTML.includes('Waiting for events')) {
                eventsDiv.innerHTML = eventHtml;
            } else {
                eventsDiv.innerHTML = eventHtml + eventsDiv.innerHTML;
            }

            // Keep only last 15 events
            if (eventsDiv.children.length > 15) {
                eventsDiv.removeChild(eventsDiv.lastChild);
            }
        });

        // Socket events
        socket.on('visitor-count', (count) => {
            document.getElementById('activeCount').innerText = count;
        });

        socket.on('session-details', (sessions) => {
            updateTrafficSources(sessions);
            updateLocations(sessions);
            updateDevices(sessions);
            updateBrowsers(sessions);
            updateMap(sessions);
        });

        // Connection handling
        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('request-initial');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
        });

        // Initialize
        initMap();
    </script>
</body>

</html>
