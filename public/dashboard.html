<!DOCTYPE html>
<html>

<head>
    <title>Live Visitor Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>

    <!-- Leaflet CSS and JS for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .big-number {
            font-size: 72px;
            font-weight: bold;
            color: #007bff;
            text-align: center;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 250px;
        }

        .full-width {
            width: 100%;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 8px;
        }

        .map-container {
            position: relative;
        }

        .map-note {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 Live Visitor Dashboard</h1>

        <!-- Active Sessions Card -->
        <div class="card">
            <div class="card-title">👥 Active Sessions Right Now</div>
            <div class="big-number" id="activeCount">0</div>
        </div>

        <!-- Map Card -->
        <div class="card">
            <div class="card-title">🌍 Real-Time Visitor Locations Map</div>
            <div id="map"></div>
            <div class="map-note">📍 Each marker shows a visitor's approximate location</div>
        </div>

        <div class="row">
            <!-- Traffic Sources Card -->
            <div class="col">
                <div class="card">
                    <div class="card-title">🔗 Traffic Sources</div>
                    <div id="sourcesList">Loading...</div>
                </div>
            </div>

            <!-- Locations List Card -->
            <div class="col">
                <div class="card">
                    <div class="card-title">📍 Top Locations</div>
                    <div id="locationsList">Loading...</div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Devices Card -->
            <div class="col">
                <div class="card">
                    <div class="card-title">📱 Devices</div>
                    <div id="devicesList">Loading...</div>
                </div>
            </div>

            <!-- Browsers Card -->
            <div class="col">
                <div class="card">
                    <div class="card-title">🌐 Browsers</div>
                    <div id="browsersList">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let map;
        let markers = {};

        // Initialize map
        function initMap() {
            map = L.map('map').setView([20.59, 78.96], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // Get coordinates from location string
        function getCoordinatesFromLocation(location) {
            const locationMap = {
                'Pune': [18.5204, 73.8567],
                'Mumbai': [19.0760, 72.8777],
                'Delhi': [28.6139, 77.2090],
                'Bangalore': [12.9716, 77.5946],
                'Chennai': [13.0827, 80.2707],
                'Kolkata': [22.5726, 88.3639],
                'Hyderabad': [17.3850, 78.4867],
                'Ahmedabad': [23.0225, 72.5714],
                'Jaipur': [26.9124, 75.7873],
                'Lucknow': [26.8467, 80.9462],
                'Indore': [22.7196, 75.8577],
                'Surat': [21.1702, 72.8311],
                'Vadodara': [22.3072, 73.1812],
                'Nagpur': [21.1458, 79.0882],
                'Nashik': [19.9975, 73.7898],
                'Rajkot': [22.3039, 70.8022],
                'Bhopal': [23.2599, 77.4126],
                'Chandigarh': [30.7333, 76.7794]
            };

            for (const [city, coords] of Object.entries(locationMap)) {
                if (location.includes(city)) {
                    return coords;
                }
            }

            if (location.includes('United States')) return [37.0902, -95.7129];
            if (location.includes('United Kingdom')) return [55.3781, -3.4360];
            if (location.includes('Canada')) return [56.1304, -106.3468];

            return [20.5937, 78.9629];
        }

        // Update map with current visitors
        function updateMap(sessions) {
            for (let id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};

            let locationCounts = {};

            Object.values(sessions).forEach(session => {
                const location = session.location;
                if (location && location !== 'Unknown' && !location.includes('approx')) {
                    locationCounts[location] = (locationCounts[location] || 0) + 1;
                }
            });

            if (Object.keys(locationCounts).length === 0) {
                return;
            }

            for (const [location, count] of Object.entries(locationCounts)) {
                const coords = getCoordinatesFromLocation(location);
                const marker = L.marker(coords).addTo(map);
                marker.bindPopup(`
                <b>📍 ${location}</b><br>
                👥 ${count} active visitor${count > 1 ? 's' : ''}
            `);
                markers[location] = marker;
            }
        }

        // Update traffic sources table
        function updateTrafficSources(sessions) {
            const sources = {};
            Object.values(sessions).forEach(session => {
                const source = session.source;
                sources[source] = (sources[source] || 0) + 1;
            });

            let html = '<table style="width:100%">';
            if (Object.keys(sources).length === 0) {
                html += '<tr><td style="text-align:center; color:#888;">No visitors yet</td></tr>';
            } else {
                for (const [source, count] of Object.entries(sources)) {
                    html += `<tr><td><strong>${source}</strong></td><td style="text-align:right">${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
                }
            }
            html += '</table>';
            document.getElementById('sourcesList').innerHTML = html;
        }

        // Update locations table
        function updateLocations(sessions) {
            const locations = {};
            Object.values(sessions).forEach(session => {
                const location = session.location;
                locations[location] = (locations[location] || 0) + 1;
            });

            const sorted = Object.entries(locations).sort((a, b) => b[1] - a[1]).slice(0, 5);

            let html = '<table style="width:100%">';
            if (sorted.length === 0) {
                html += '<tr><td style="text-align:center; color:#888;">No visitors yet</td></tr>';
            } else {
                for (const [location, count] of sorted) {
                    html += `<tr><td><strong>${location}</strong></td><td style="text-align:right">${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
                }
            }
            html += '</table>';
            document.getElementById('locationsList').innerHTML = html;
        }

        // Update devices table
        function updateDevices(sessions) {
            const devices = {};
            Object.values(sessions).forEach(session => {
                const device = session.device;
                devices[device] = (devices[device] || 0) + 1;
            });

            let html = '<table style="width:100%">';
            if (Object.keys(devices).length === 0) {
                html += '<tr><td style="text-align:center; color:#888;">No visitors yet</td></tr>';
            } else {
                for (const [device, count] of Object.entries(devices)) {
                    html += `<tr><td><strong>${device}</strong></td><td style="text-align:right">${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
                }
            }
            html += '</table>';
            document.getElementById('devicesList').innerHTML = html;
        }

        // Update browsers table
        function updateBrowsers(sessions) {
            const browsers = {};
            Object.values(sessions).forEach(session => {
                const browser = session.browser;
                browsers[browser] = (browsers[browser] || 0) + 1;
            });

            let html = '<table style="width:100%">';
            if (Object.keys(browsers).length === 0) {
                html += '<tr><td style="text-align:center; color:#888;">No visitors yet</td></tr>';
            } else {
                for (const [browser, count] of Object.entries(browsers)) {
                    html += `<tr><td><strong>${browser}</strong></td><td style="text-align:right">${count} visitor${count > 1 ? 's' : ''}</td></tr>`;
                }
            }
            html += '</table>';
            document.getElementById('browsersList').innerHTML = html;
        }

        // Socket event listeners
        socket.on('visitor-count', (count) => {
            document.getElementById('activeCount').innerText = count;
        });

        socket.on('session-details', (sessions) => {
            updateTrafficSources(sessions);
            updateLocations(sessions);
            updateDevices(sessions);
            updateBrowsers(sessions);
            updateMap(sessions);
        });

        // Reconnection handling
        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            const countElement = document.getElementById('activeCount');
            if (countElement) countElement.style.color = '#ff4444';
        });

        socket.on('connect', () => {
            console.log('Reconnected to server');
            const countElement = document.getElementById('activeCount');
            if (countElement) countElement.style.color = '#007bff';
            socket.emit('request-initial');
        });

        // Initialize
        initMap();
        socket.emit('request-initial');
    </script>
</body>

</html>
