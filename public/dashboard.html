<!DOCTYPE html>
<html>

<head>
    <title>Live Visitor Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .big-number {
            font-size: 72px;
            font-weight: bold;
            color: #007bff;
            text-align: center;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 250px;
        }

        .stat-table {
            width: 100%;
            border-collapse: collapse;
        }

        .stat-table tr {
            border-bottom: 1px solid #eee;
        }

        .stat-table td {
            padding: 10px 5px;
        }

        .stat-table td:first-child {
            font-weight: normal;
            color: #333;
        }

        .stat-table td:last-child {
            text-align: right;
            font-weight: bold;
            color: #007bff;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 8px;
        }

        .map-note {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div class="container">
        <h1>Live Visitor Dashboard</h1>

        <div class="card">
            <div class="card-title">Active Sessions Right Now</div>
            <div class="big-number" id="activeCount">0</div>
        </div>

        <div class="card">
            <div class="card-title">Real-Time Visitor Locations Map</div>
            <div id="map"></div>
            <div class="map-note">Each marker shows a visitor's approximate location</div>
        </div>

        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-title">Traffic Sources</div>
                    <div id="sourcesList"></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-title">Top Locations</div>
                    <div id="locationsList"></div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-title">Devices</div>
                    <div id="devicesList"></div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-title">Browsers</div>
                    <div id="browsersList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let map;
        let markers = {};

        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        function getCoordinatesFromLocation(location) {
            const locationMap = {
                'Pune': [18.5204, 73.8567],
                'Mumbai': [19.0760, 72.8777],
                'Delhi': [28.6139, 77.2090],
                'Bangalore': [12.9716, 77.5946],
                'Chennai': [13.0827, 80.2707],
                'Kolkata': [22.5726, 88.3639],
                'Hyderabad': [17.3850, 78.4867]
            };

            for (const [city, coords] of Object.entries(locationMap)) {
                if (location.includes(city)) {
                    return coords;
                }
            }
            return [20.5937, 78.9629];
        }

        function updateMap(sessions) {
            for (let id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};

            let locationCounts = {};
            Object.values(sessions).forEach(session => {
                const location = session.location;
                if (location && location !== 'Unknown') {
                    locationCounts[location] = (locationCounts[location] || 0) + 1;
                }
            });

            for (const [location, count] of Object.entries(locationCounts)) {
                const coords = getCoordinatesFromLocation(location);
                const marker = L.marker(coords).addTo(map);
                marker.bindPopup('<b>' + location + '</b><br>' + count + ' visitors');
                markers[location] = marker;
            }
        }

        function createTable(data) {
            if (Object.keys(data).length === 0) {
                return '<div class="no-data">No visitors yet</div>';
            }
            let html = '<table class="stat-table">';
            for (const [key, value] of Object.entries(data)) {
                html += '<tr>';
                html += '<td>' + key + '</td>';
                html += '<td>' + value + ' visitor' + (value > 1 ? 's' : '') + '</td>';
                html += '</tr>';
            }
            html += '</table>';
            return html;
        }

        socket.on('visitor-count', (count) => {
            document.getElementById('activeCount').innerText = count;
        });

        socket.on('session-details', (sessions) => {
            updateMap(sessions);

            // Traffic Sources
            const sources = {};
            Object.values(sessions).forEach(s => {
                sources[s.source] = (sources[s.source] || 0) + 1;
            });
            document.getElementById('sourcesList').innerHTML = createTable(sources);

            // Locations
            const locations = {};
            Object.values(sessions).forEach(s => {
                if (s.location && s.location !== 'Unknown') {
                    locations[s.location] = (locations[s.location] || 0) + 1;
                }
            });
            document.getElementById('locationsList').innerHTML = createTable(locations);

            // Devices
            const devices = {};
            Object.values(sessions).forEach(s => {
                devices[s.device] = (devices[s.device] || 0) + 1;
            });
            document.getElementById('devicesList').innerHTML = createTable(devices);

            // Browsers
            const browsers = {};
            Object.values(sessions).forEach(s => {
                browsers[s.browser] = (browsers[s.browser] || 0) + 1;
            });
            document.getElementById('browsersList').innerHTML = createTable(browsers);
        });

        socket.on('connect', () => {
            socket.emit('request-initial');
        });

        initMap();
    </script>
</body>

</html>
